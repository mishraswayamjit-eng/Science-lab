<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olympiad Revision Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   OLYMPIAD REVISION HUB  —  self-contained study asset
   How to add content:  scroll to the DATA object near the
   bottom of this file. Add a chapter object to a subject's
   "chapters" array, or flip a subject's status to "active".
   Schema is documented just above DATA.
   ============================================================ */
:root{
  --bg:#eef2f6; --panel:#ffffff; --ink:#16243b; --muted:#5b6b82;
  --line:#dde5ee; --soft:#f4f7fb;
  --sci:#1f9e6a; --sci-d:#157a51; --sci-soft:#e7f5ee;
  --math:#5a51d6; --eng:#e8543e;
  --bite:#f6a609; --bite-soft:#fff4dc;
  --ok:#1f9e6a; --no:#e8543e;
  --shadow:0 1px 2px rgba(20,36,59,.06),0 8px 24px rgba(20,36,59,.07);
  --radius:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Baloo 2",Inter,sans-serif;line-height:1.15;margin:0}
a{color:inherit}
button{font-family:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 18px}

/* header */
header.app{
  position:sticky;top:0;z-index:20;background:rgba(238,242,246,.86);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}
.app .wrap{display:flex;align-items:center;gap:14px;height:62px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--sci),#2bbf86);color:#fff;font-family:"Baloo 2";font-weight:800;font-size:19px}
.brand b{font-family:"Baloo 2";font-weight:700;font-size:19px;letter-spacing:.2px}
.brand span{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:-3px;letter-spacing:.3px}
.crumbs{margin-left:auto;font-size:13px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumbs button{background:none;border:0;color:var(--muted);cursor:pointer;font-weight:600;font-size:13px;padding:2px 0}
.crumbs button:hover{color:var(--ink)}
.crumbs .here{color:var(--ink)}
.crumbs .sep{opacity:.5}

main{padding:30px 0 70px;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main,*{animation:none!important;transition:none!important}}

/* landing hero */
.hero{margin-bottom:26px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--sci-d)}
.hero h1{font-size:clamp(30px,6vw,46px);font-weight:800;margin:6px 0 8px}
.hero p{color:var(--muted);max-width:60ch;margin:0;font-size:16px}

/* subject cards */
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:26px}
.subj{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 22px 20px;box-shadow:var(--shadow);text-align:left;cursor:pointer;overflow:hidden;
  transition:transform .18s ease,box-shadow .18s ease}
.subj:disabled{cursor:default}
.subj.active:hover{transform:translateY(-3px);box-shadow:0 6px 14px rgba(20,36,59,.1),0 18px 40px rgba(20,36,59,.1)}
.subj .spine{position:absolute;left:0;top:0;bottom:0;width:6px}
.subj .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;margin-bottom:14px}
.subj h3{font-size:21px;font-weight:700}
.subj .grade{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:1px}
.subj p{font-size:13.5px;color:var(--muted);margin:10px 0 14px}
.subj .meta{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600}
.chip-count{color:var(--ink)}
.tag{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.tag.soon{background:#eef1f5;color:#8a98ab}
.tag.live{background:var(--sci-soft);color:var(--sci-d)}
.go{font-weight:700;color:var(--sci-d)}

/* chapter list */
.section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.section-head h2{font-size:28px;font-weight:800}
.section-head .count{color:var(--muted);font-weight:600;font-size:14px}
.chapters{display:grid;gap:13px}
.chcard{display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%;
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s}
.chcard:hover{transform:translateY(-2px);border-color:#cfe6da;box-shadow:0 6px 14px rgba(20,36,59,.09)}
.chnum{flex:0 0 auto;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  background:var(--sci-soft);color:var(--sci-d);font-family:"Baloo 2";font-weight:800;font-size:19px}
.chbody{flex:1;min-width:0}
.chbody h3{font-size:17.5px;font-weight:700}
.topics{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.topic{font-size:11.5px;font-weight:600;color:var(--sci-d);background:var(--sci-soft);
  padding:3px 9px;border-radius:999px}
.charrow{flex:0 0 auto;color:#9fb0c4;font-size:22px}

/* chapter detail */
.detail-head{margin-bottom:18px}
.detail-head .kicker{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--sci-d)}
.detail-head h2{font-size:clamp(24px,5vw,34px);font-weight:800;margin:4px 0 10px}
.tabs{display:inline-flex;background:#e4eaf1;border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:none;padding:9px 20px;border-radius:9px;font-weight:700;font-size:14px;
  color:var(--muted);cursor:pointer;transition:.15s}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--sci-d);box-shadow:0 1px 3px rgba(20,36,59,.1)}

/* notes */
.notes{margin-top:22px;display:grid;gap:16px}
.nsec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow)}
.nsec h3{font-size:19px;font-weight:700;color:var(--sci-d);margin-bottom:6px;display:flex;align-items:center;gap:9px}
.nsec h3::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--sci);flex:0 0 auto}
.nsec .intro{color:var(--muted);margin:2px 0 12px;font-size:15px}
.nsec ul{margin:6px 0 0;padding-left:0;list-style:none;display:grid;gap:7px}
.nsec li{position:relative;padding-left:22px;font-size:15.5px}
.nsec li::before{content:"";position:absolute;left:4px;top:10px;width:6px;height:6px;border-radius:50%;
  background:var(--sci);opacity:.7}
.nsec li b{font-weight:700}
.deflist{display:grid;gap:8px;margin-top:6px}
.def{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:12px;align-items:start;
  padding:9px 0;border-bottom:1px dashed var(--line)}
.def:last-child{border-bottom:0}
.def dt{font-weight:700;color:var(--ink)}
.def dd{margin:0;color:var(--muted);font-size:15px}
table.facts{width:100%;border-collapse:collapse;margin-top:8px;font-size:14.5px}
table.facts th,table.facts td{text-align:left;padding:9px 11px;border:1px solid var(--line);vertical-align:top}
table.facts th{background:var(--sci-soft);color:var(--sci-d);font-weight:700;font-family:Inter}
table.facts tr:nth-child(even) td{background:var(--soft)}
.bite{margin-top:14px;background:var(--bite-soft);border:1px solid #f4dca0;border-radius:12px;
  padding:13px 15px 13px 44px;position:relative;font-size:14.5px}
.bite::before{content:"\1F4A1";position:absolute;left:14px;top:12px;font-size:18px}
.bite b{color:#a06b00;display:block;font-family:"Baloo 2";font-weight:700;font-size:13px;letter-spacing:.4px;
  text-transform:uppercase;margin-bottom:2px}

/* quiz */
.quiz{margin-top:22px}
.qbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.progress{flex:1;min-width:160px;height:8px;background:#e1e8f0;border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--sci);width:0;transition:width .3s ease}
.score{font-weight:700;font-size:14px;color:var(--muted)}
.score b{color:var(--sci-d)}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow)}
.qcard .qn{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.qcard .qtext{font-size:18px;font-weight:600;margin:7px 0 16px;font-family:"Baloo 2"}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--soft);
  border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;font-size:15.5px;cursor:pointer;
  transition:.14s;color:var(--ink)}
.opt:hover:not(:disabled){border-color:#bcd9ca;background:#fff}
.opt:disabled{cursor:default}
.opt .key{flex:0 0 auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:#e4eaf1;font-weight:700;font-size:13px;color:var(--muted)}
.opt.correct{border-color:var(--ok);background:var(--sci-soft)}
.opt.correct .key{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:#fdecea}
.opt.wrong .key{background:var(--no);color:#fff}
.explain{margin-top:14px;font-size:14.5px;background:var(--soft);border-left:3px solid var(--sci);
  border-radius:0 10px 10px 0;padding:11px 14px;color:#34465f}
.explain b{color:var(--sci-d)}
.qnav{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:12px 22px;font-weight:700;font-size:14.5px;cursor:pointer;transition:.15s}
.btn.primary{background:var(--sci);color:#fff}
.btn.primary:hover{background:var(--sci-d)}
.btn.ghost{background:#e4eaf1;color:var(--ink)}
.btn.ghost:hover{background:#d8e0ea}
.btn:disabled{opacity:.45;cursor:default}
.result{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px;text-align:center;box-shadow:var(--shadow)}
.result .big{font-family:"Baloo 2";font-weight:800;font-size:52px;color:var(--sci-d);line-height:1}
.result h3{font-size:24px;font-weight:700;margin:8px 0 4px}
.result p{color:var(--muted);margin:0 0 18px}

.placeholder{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:40px;text-align:center;color:var(--muted)}
.placeholder b{color:var(--ink);font-family:"Baloo 2";font-size:20px;display:block;margin-bottom:6px}

footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:12.5px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

:focus-visible{outline:3px solid #9ad9bf;outline-offset:2px;border-radius:8px}
@media(max-width:560px){
  .def{grid-template-columns:1fr;gap:2px}
  .hero h1{font-size:30px}
  .tabs button{padding:9px 16px}
}
</style>
</head>
<body>
<header class="app">
  <div class="wrap">
    <button class="brand" id="home" aria-label="Go to home">
      <span class="logo">O</span>
      <span><b>Olympiad Revision Hub</b><span>Notes &amp; quizzes, chapter by chapter</span></span>
    </button>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<footer><div class="wrap">
  <span>Lesson notes &amp; questions adapted from MTG Science Olympiad Prep-Guide &amp; Workbook, Class 5.</span>
  <span>For revision &amp; practice.</span>
</div></footer>

<script>
/* =================================================================
   DATA SCHEMA
   subject:  { id, name, grade, icon, color(hex), soft(hex), status:"active"|"soon", blurb, chapters:[...] }
   chapter:  { n, title, topics:[..], notes:[section], quiz:[question] }
   section:  { h, intro?, points?:[..], defs?:[[term,def]..], table?:{cols:[],rows:[[]]}, bite?:str }
   question: { q, options:[a,b,c,d], answer:<0-3>, explain }
   To extend: add chapters to "chapters", or set a subject's status to "active" and fill its chapters.
   ================================================================= */
const DATA={subjects:[
{
 id:"science",name:"Science Olympiad Prep",grade:"Class 5",icon:"\uD83D\uDD2C",
 color:"#1f9e6a",soft:"#e7f5ee",status:"active",
 blurb:"All 8 chapters with detailed revision notes and a quiz for each.",
 chapters:[

 /* ---------------- CHAPTER 1 ---------------- */
 {n:1,title:"Animals",
  topics:["Habitats","Body coverings","Eating habits","Breathing","Movements","Adaptations"],
  notes:[
   {h:"Habitats of animals",intro:"A habitat is the place where an animal lives, grows and reproduces. Animals have adapted features to survive in their habitat.",
    defs:[
     ["Terrestrial","Live on land \u2013 camel, elephant, lion, snake (in burrows)."],
     ["Arboreal","Live on trees \u2013 monkey, squirrel, koala, sloth."],
     ["Aquatic","Live in water \u2013 fish, whale, dolphin, octopus."],
     ["Aerial","Stay mostly in air \u2013 birds, bats."],
     ["Amphibians","Live both on land and in water \u2013 frog, toad."]]},
   {h:"Body coverings",intro:"Body covering keeps the animal warm and protects it from predators.",
    defs:[
     ["Scales","Fish, reptiles, bird legs. Fish scales come from the deeper dermal layer; reptile/bird scales from the epidermis."],
     ["Shell","Hard covering on snail, tortoise, armadillo."],
     ["Feathers","Cover birds; keep them warm and help flight."],
     ["Spines","Needle-like outgrowths on hedgehog, porcupine, spiny anteater."],
     ["Cuticle","Hard covering on insects like butterfly, grasshopper, beetle."]],
    bite:"Skin of crocodile, shell of tortoise and bony armour of armadillo are made of scutes \u2013 bony external plates from the deeper layer of skin, similar in function to scales."},
   {h:"Eating habits (and teeth)",
    defs:[
     ["Herbivores","Eat only plants. Sharp incisors to cut; flat premolars & molars to grind (cow, goat, zebra)."],
     ["Carnivores","Eat flesh. Sharp pointed canines to tear; strong premolars & molars (lion, tiger)."],
     ["Omnivores","Eat both plants & animals. Sharp & flat incisors plus flat broad molars (bear, humans)."],
     ["Scavengers","Feed on dead animals (vulture, hyena)."],
     ["Rodents","Gnaw their food; sharp strong front teeth (rat, rabbit, squirrel)."]]},
   {h:"Breathing methods",intro:"Oxygen burns food in the body to release energy. Different animals breathe in different ways.",
    defs:[
     ["Through skin","Earthworm (moist skin); Amoeba & Paramecium (body surface); frog (moist skin in water)."],
     ["Through spiracles","Insects \u2013 air enters spiracles and passes through tubes called tracheae."],
     ["Through gills","Fish, tadpole, prawn \u2013 gills take in oxygen dissolved in water."],
     ["Through lungs","Reptiles, birds, mammals. Whales & dolphins breathe air through blowholes."]]},
   {h:"Movements in animals",intro:"The ability to move from place to place is called locomotion.",
    points:["Walk \u2013 humans (on hindlimbs), horse, deer, leopard (on all four).",
     "Hop / jump \u2013 rabbit, kangaroo (hindlimbs).","Crawl \u2013 lizard, crocodile.","Slither \u2013 snake.",
     "Swim \u2013 fish (fins), duck (webbed feet), sea turtle & penguin (flippers).",
     "Fly \u2013 birds & bats (modified forelimbs); insects (forewings & hindwings)."],
    bite:"Insect wings have no bones; bird and bat wings do. Insect wings are covered with scales, bat wings with bare skin, bird wings with feathers."},
   {h:"Adaptations",intro:"Adaptation is the adjustment of an animal to its environment to survive better.",
    defs:[
     ["Migration","Long-distance movement to escape unfavourable conditions. Arctic tern (Arctic\u2194Antarctic, ~71,000 km \u2013 longest migration); Siberian cranes, salmon, eels, monarch butterfly, locusts."],
     ["Camouflage","Blending with surroundings to avoid prey/predator \u2013 chameleon, polar bear (white fur), stonefish."],
     ["Mimicry","Resembling another organism or object \u2013 viceroy butterfly mimics monarch; leaf insect mimics leaves."]]}],
  quiz:[
   {q:"Animals that live on trees are called",options:["Terrestrial","Arboreal","Aquatic","Aerial"],answer:1,explain:"Arboreal animals such as the monkey, sloth and koala live on trees."},
   {q:"Which teeth do carnivores use to tear flesh?",options:["Incisors","Canines","Premolars","Molars"],answer:1,explain:"Carnivores have sharp pointed canines for tearing flesh."},
   {q:"Earthworms breathe through their",options:["Lungs","Gills","Moist skin","Spiracles"],answer:2,explain:"Earthworms breathe through their moist skin."},
   {q:"The longest migration of any animal is made by the",options:["Salmon","Locust","Arctic tern","Monarch butterfly"],answer:2,explain:"The Arctic tern travels about 71,000 km between the Arctic and Antarctic each year."},
   {q:"Bodies of insects like the butterfly and beetle are covered by",options:["Scales","A shell","A cuticle","Feathers"],answer:2,explain:"Insects have a hard outer covering called a cuticle."},
   {q:"Whales and dolphins breathe through",options:["Gills","Blowholes","Moist skin","Spiracles"],answer:1,explain:"Whales and dolphins are mammals; they come to the surface and breathe air through blowholes."},
   {q:"An animal that blends with its surroundings to avoid predators shows",options:["Migration","Mimicry","Camouflage","Hibernation"],answer:2,explain:"Camouflage is blending with the surroundings, like a chameleon or polar bear."},
   {q:"Rabbits, rats and squirrels belong to the group of",options:["Reptiles","Rodents","Amphibians","Carnivores"],answer:1,explain:"They gnaw their food and have sharp front teeth \u2013 they are rodents (and mammals)."},
   {q:"The bony external plates on a crocodile's skin and a tortoise's shell are called",options:["Scales","Scutes","Spines","Feathers"],answer:1,explain:"They are scutes \u2013 bony plates formed from the deeper layer of skin."},
   {q:"Frogs breathe through their ____ when they are in water.",options:["Lungs","Gills","Moist skin","Spiracles"],answer:2,explain:"In water frogs breathe through their moist skin; on land they use lungs."}]
 },

 /* ---------------- CHAPTER 2 ---------------- */
 {n:2,title:"Human Body and Health",
  topics:["Skeletal & muscular system","Nervous system","Food & nutrients","Diseases","Safety & first aid"],
  notes:[
   {h:"Organisation of the body",intro:"Cell \u2192 Tissue \u2192 Organ \u2192 Organ system \u2192 Organism. The body has digestive, skeletal, muscular, nervous, circulatory and respiratory systems.",
    points:["A new-born baby has about 300 bones; these fuse to 206 bones in an adult.",
     "Bones are made of calcium and phosphorus; bone marrow inside makes blood cells.",
     "The skeleton = skull, backbone, ribcage, two pairs of limbs and two pairs of girdles."]},
   {h:"The skeleton",
    defs:[
     ["Skull","Protects the brain; 22 bones (8 cranial + 14 facial). All fixed except the movable lower jaw."],
     ["Backbone","33 vertebrae forming the vertebral column; protects the spinal cord. First bone = atlas, last = tail bone."],
     ["Ribcage","12 pairs of ribs. First 7 pairs = true ribs (joined to breast bone/sternum); next 3 = false ribs; last 2 = floating ribs (joined only to the backbone)."],
     ["Limbs","Forelimbs (arms) & hindlimbs (legs); 30 bones each. Humerus = longest bone in the arm; femur = longest & strongest bone in the body."],
     ["Girdles","Pectoral (shoulder) girdle and pelvic (hip) girdle."]],
    bite:"Bones are very hard, but the hardest substance in the body is the enamel coating on our teeth."},
   {h:"Joints",intro:"A joint is where two or more bones meet. Skull joints are immovable. Four movable joints:",

     ["Hinge joint","Moves in one direction \u2013 knee, elbow, fingers, toes."],
     ["Ball and socket","Moves in all directions \u2013 shoulder and hip."],
     ["Pivot joint","Between atlas and axis; lets the head turn sideways."],
     ["Gliding joint","Back-and-forth and side-to-side \u2013 wrist and ankle."]],
    bite:"A ligament joins bone to bone (holds joints together). A tendon attaches muscle to bone."},
   {h:"Muscular system",intro:"Over 600 muscles, attached to bones by tendons.",
    defs:[
     ["Skeletal (voluntary)","Under our control; striped; in arms, legs, hands, feet."],
     ["Smooth (involuntary)","Not under our control; no stripes; e.g. in the stomach."],
     ["Cardiac","Heart muscle; involuntary but striped; works all our life without tiring."]],
    points:["Muscles can only pull, not push, so they work in pairs (biceps & triceps bend and straighten the arm)."]},
   {h:"Nervous system",intro:"Made of the brain, spinal cord and nerves; lets us think, learn and feel.",
    defs:[
     ["Cerebrum","Largest part of the brain; thinking, learning, memory and senses."],
     ["Cerebellum","Balance, posture and muscle movements (the hindbrain)."],
     ["Medulla / brain stem","Controls involuntary actions \u2013 heartbeat, breathing, blood circulation."],
     ["Spinal cord","Connects the body to the brain; controls reflex actions."],
     ["Reflex action","A sudden, involuntary response to a stimulus, controlled by the spinal cord (pulling your hand off a hot object)."]]},
   {h:"Sense organs",intro:"Five sense organs connect us to the world.",
    defs:[
     ["Eyes (sight)","Iris controls light by changing the pupil; lens focuses light onto the retina; retina sends the image to the brain via the optic nerve. Cornea absorbs harmful UV."],
     ["Ears (hearing)","Outer ear collects sound; middle ear has 3 ossicles that amplify it ~10\u00d7; inner ear sends sound to the brain via the auditory nerve."],
     ["Nose (smell)","Receptors send messages via the olfactory nerve."],
     ["Tongue (taste)","Taste buds detect sweet, salty, sour and bitter."],
     ["Skin (touch)","Largest organ; senses touch, heat, pain and pressure; removes sweat."]]},
   {h:"Food and nutrients",
    defs:[
     ["Carbohydrates","Energy-giving (rice, potato, bread, sugar). Broken down to glucose."],
     ["Fats","Energy-giving & stored; keep us warm (butter, ghee, oil). Excess \u2192 obesity."],
     ["Proteins","Body-building; build & repair tissues (eggs, fish, milk, pulses, meat)."],
     ["Roughage","Fibre that helps remove waste (vegetables, fruits, cereal coverings)."],
     ["Water","Forms part of blood; removes waste as urine & sweat (6\u20138 glasses a day)."]],
    points:["A balanced diet has all nutrients in the right amounts, with roughage and water."]},
   {h:"Vitamins, minerals & deficiency diseases",
    table:{cols:["Nutrient","Good sources","Deficiency disease"],rows:[

 {n:3,title:"Plants",
  topics:["Parts of a plant","Reproduction","Seed dispersal","Germination","Crops & agriculture"],
  notes:[
   {h:"Parts of a plant",
    defs:[
     ["Root","Holds the plant firmly, absorbs water & minerals, stores food. Tap root (one main root \u2013 pea, carrot) or fibrous root (bushy bunch \u2013 grass, rice)."],
     ["Stem","Carries water up and food down; bears leaves, flowers, fruits. Modified stems store food (potato, ginger)."],

    bite:"Tiny holes called stomata on the leaf surface let air enter and leave the leaf."},

     ["By seeds","Most flowering plants."],
     ["By spores","Ferns and mosses."],

     "Germination needs air, water and warmth.",

    defs:[

     "Threshing separates grain from stalks; winnowing separates grain from chaff using the wind.",
     "A seed drill sows seeds; a sickle/harvester cuts crops."]}],

    defs:[

     ["Water pollution","From sewage, factory waste, farm run-off and oil spills (causes cholera, typhoid)."],

     ["Noise pollution","Excess noise from vehicles, machines, loudspeakers."]]},

    defs:[

     ["Global warming","Greenhouse gases (CO\u2082, methane) trap heat, raising Earth's temperature and melting polar ice."]],

     "The Montreal Protocol (1987) was signed to reduce CFCs; the Kyoto Protocol (1997) targets greenhouse gases."]},

    defs:[

     ["Volcano","An opening in the crust through which magma escapes. Magma above ground is called lava. Types: active, dormant and extinct."],

     ["Shape","Definite","Takes container's shape","No definite shape"],

     ["Example","Rock, pencil","Water, milk","Oxygen, water vapour"]]}},

    defs:[

     ["Sublimation","Solid \u2192 gas directly on heating (naphthalene balls)."],
     ["Condensation","Gas \u2192 liquid on cooling."],
     ["Freezing","Liquid \u2192 solid on cooling (water \u2192 ice)."]]},

     ["Soft drink","Gas in liquid","Carbon dioxide","Water"],
     ["Sugar solution","Solid in liquid","Sugar","Water"],
     ["Brass","Solid in solid","Zinc","Copper"]]},

    defs:[

   {q:"In which state are molecules packed most tightly?",options:["Solid","Liquid","Gas","All equally"],answer:0,explain:"Solid molecules are packed tightly with strong attraction."},
   {q:"The change of a solid directly into a gas on heating is called",options:["Melting","Evaporation","Sublimation","Condensation"],answer:2,explain:"Sublimation turns a solid straight into a gas (e.g., naphthalene)."},
   {q:"The change of a gas into a liquid on cooling is called",options:["Freezing","Condensation","Melting","Evaporation"],answer:1,explain:"Condensation is gas turning to liquid on cooling."},
   {q:"In a sugar solution, sugar is the ____ and water is the ____.",options:["solvent, solute","solute, solvent","gas, liquid","liquid, gas"],answer:1,explain:"Sugar dissolves (solute) in water (solvent)."},
   {q:"Which of these is a chemical change?",options:["Melting ice","Dissolving sugar","Rusting of iron","Breaking a pencil"],answer:2,explain:"Rusting forms a new substance, so it is a chemical change."},
   {q:"Water is often called the",options:["universal solvent","universal solute","best insulator","heaviest liquid"],answer:0,explain:"Most substances dissolve in water, so it is the universal solvent."},
   {q:"Materials that allow light to pass through completely are",options:["Opaque","Translucent","Transparent","Lustrous"],answer:2,explain:"Transparent materials (like glass) let all light pass through."},
   {q:"Which liquids do NOT mix and form separate layers?",options:["Miscible","Immiscible","Soluble","Dissolved"],answer:1,explain:"Immiscible liquids (oil & water) form separate layers."},
   {q:"A good conductor of electricity is",options:["Plastic","Wood","Rubber","Silver"],answer:3,explain:"Silver is an excellent conductor of electricity."},
   {q:"Water is unusual because it ____ on freezing.",options:["contracts","expands","disappears","melts"],answer:1,explain:"Water expands on freezing, so ice takes more space."}]
 },

 {n:8,title:"Force and Energy",
  topics:["Types of forces","Forms of energy","Simple machines"],
  notes:[
   {h:"Force",intro:"A force is a push or pull that can start, stop, speed up, slow down or change the direction or shape of an object.",
    bite:"Forces are of two kinds: contact forces (need touching \u2013 muscular, frictional) and non-contact forces (act from a distance \u2013 magnetic, electrostatic, gravitational)."},
   {h:"Types of forces",
    defs:[
     ["Muscular force","Force from our muscles (kicking a ball). A contact force."],
     ["Frictional force","Opposes motion between surfaces; helps us walk, write and grip; wears things out. More on rough surfaces."],
     ["Mechanical force","Force applied by a machine (a crane, scissors)."],
     ["Magnetic force","A magnet attracts iron/nickel. Opposite poles attract; like poles repel."],
     ["Gravitational force","Earth pulls objects towards itself (a fruit falls down)."],
     ["Electrostatic force","Force from electric charges (a rubbed comb attracts paper)."],
     ["Buoyant force","The upward push of water on a floating object."]]},
   {h:"Energy & its forms",intro:"Energy is the ability to do work. It can change from one form to another but cannot be made or destroyed.",
    defs:[
     ["Mechanical","Due to motion (kinetic) or position (potential)."],
     ["Heat","Causes hotness; from the Sun and burning fuel."],
     ["Light","Makes things visible; can travel through vacuum."],
     ["Sound","Made by vibrations; needs a medium \u2013 cannot travel through vacuum."],
     ["Electrical","Movement of electric charges; runs our appliances."],
     ["Solar / wind / hydro / geothermal","Clean, renewable sources of energy."]],
    bite:"Energy can neither be created nor destroyed, only converted \u2013 this is the law of conservation of energy."},
   {h:"Simple machines",intro:"A simple machine makes work easier by changing the direction of a force or reducing the effort. The six simple machines are the lever, inclined plane, wheel & axle, pulley, wedge and screw.",
    defs:[
     ["Lever","A rigid bar that turns about a fixed point (fulcrum)."],
     ["Inclined plane","A sloping ramp; a longer, gentler ramp needs less effort (but more distance)."],
     ["Wheel and axle","A wheel fixed to an axle \u2013 bicycle pedal, screwdriver, steering wheel."],
     ["Pulley","A grooved wheel with a rope. A fixed pulley changes the direction of force; a movable pulley reduces effort."],
     ["Wedge","Used to split or cut \u2013 axe, knife, nail."],
     ["Screw","An inclined plane wrapped round a cylinder \u2013 bottle cap, bolt."]],
    table:{cols:["Class of lever","Arrangement","Examples"],rows:[
     ["Class 1","Fulcrum between effort and load","See-saw, scissors, crowbar, pliers"],
     ["Class 2","Load between fulcrum and effort","Wheelbarrow, nutcracker, bottle opener"],
     ["Class 3","Effort between fulcrum and load","Fishing rod, tongs, tweezers"]]}}],
  quiz:[
   {q:"A force is a",options:["Push or pull","Type of energy","Living thing","Colour"],answer:0,explain:"A force is a push or pull that changes an object's motion or shape."},
   {q:"The force that opposes motion between two surfaces is",options:["Gravitational","Magnetic","Frictional","Elastic"],answer:2,explain:"Friction opposes motion and slows moving objects down."},
   {q:"Which of these is a non-contact force?",options:["Muscular","Frictional","Mechanical","Gravitational"],answer:3,explain:"Gravitational force acts from a distance, so it is a non-contact force."},
   {q:"The energy possessed by a moving object is",options:["Potential energy","Kinetic energy","Sound energy","Chemical energy"],answer:1,explain:"A moving object has kinetic energy."},
   {q:"'Energy can neither be created nor destroyed, only converted' is the law of",options:["Gravity","Conservation of energy","Motion","Friction"],answer:1,explain:"This is the law of conservation of energy."},
   {q:"A see-saw and scissors are examples of which class of lever?",options:["Class 1","Class 2","Class 3","Class 4"],answer:0,explain:"In a Class 1 lever the fulcrum is between the effort and load."},
   {q:"A fixed pulley is used to",options:["Reduce effort","Change the direction of force","Increase the load","Remove friction"],answer:1,explain:"A fixed pulley changes the direction of force but does not reduce effort."},
   {q:"Which simple machine is used to split or cut things (like an axe)?",options:["Lever","Pulley","Wedge","Wheel and axle"],answer:2,explain:"A wedge is used to split, cut or separate."},
   {q:"The upward push of water on a floating object is called",options:["Frictional force","Buoyant force","Elastic force","Magnetic force"],answer:1,explain:"Buoyant force is the upward push of water on a floating object."},

   {q:"Opposite poles of a magnet ____ each other.",options:["repel","attract","ignore","melt"],answer:1,explain:"Opposite poles attract; like poles repel."},

{id:"maths",name:"Maths Olympiad Prep",grade:"Class 5",icon:"\u2795",color:"#5a51d6",soft:"#ecebfb",status:"soon",
 blurb:"Notes and quizzes coming in the next sprint.",chapters:[]},
{id:"english",name:"English Olympiad Prep",grade:"Class 5",icon:"\u270D\uFE0F",color:"#e8543e",soft:"#fdecea",status:"soon",
 blurb:"Notes and quizzes coming in the next sprint.",chapters:[]}
]};

/* ===================== APP ===================== */
const root=document.getElementById("view");
const crumbs=document.getElementById("crumbs");
let state={page:"home",subject:null,chapter:null,tab:"notes"};
let quiz={i:0,picked:null,correct:0,done:false};

function setSubjectTheme(s){
  const r=document.documentElement.style;
  if(s){r.setProperty("--sci",s.color);r.setProperty("--sci-soft",s.soft);
        r.setProperty("--sci-d",shade(s.color,-18));}
  else{r.setProperty("--sci","#1f9e6a");r.setProperty("--sci-soft","#e7f5ee");r.setProperty("--sci-d","#157a51");}
}
function shade(hex,p){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
  const f=x=>Math.max(0,Math.min(255,Math.round(x+(x*p/100))));
  return "#"+(1<<24|f(r)<<16|f(g)<<8|f(b)).toString(16).slice(1);}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function go(p,opt={}){state={...state,page:p,...opt};if(p!=="chapter")quiz={i:0,picked:null,correct:0,done:false};render();window.scrollTo({top:0,behavior:"instant"});}

function render(){
  const s=DATA.subjects.find(x=>x.id===state.subject);
  setSubjectTheme(state.page==="home"?null:s);
  renderCrumbs(s);
  if(state.page==="home")return renderHome();
  if(state.page==="subject")return renderSubject(s);
  if(state.page==="chapter")return renderChapter(s);
}

function renderCrumbs(s){
  let h='<button onclick="go(\'home\')">Home</button>';
  if(state.page!=="home"&&s){h+='<span class="sep">/</span>';
    h+=state.page==="subject"?`<span class="here">${esc(s.name)}</span>`
      :`<button onclick="go('subject',{subject:'${s.id}'})">${esc(s.name)}</button>`;}
  if(state.page==="chapter"&&s){const c=s.chapters.find(x=>x.n===state.chapter);
    h+=`<span class="sep">/</span><span class="here">Ch ${c.n}. ${esc(c.title)}</span>`;}
  crumbs.innerHTML=h;
}

function renderHome(){
  const cards=DATA.subjects.map(s=>{
    const live=s.status==="active",n=s.chapters.length;
    return `<button class="subj ${live?'active':''}" ${live?`onclick="go('subject',{subject:'${s.id}'})"`:'disabled'}
      style="--sci:${s.color};--sci-soft:${s.soft};--sci-d:${shade(s.color,-18)}">
      <span class="spine" style="background:${s.color}"></span>
      <span class="ico" style="background:${s.soft};color:${shade(s.color,-18)}">${s.icon}</span>
      <h3>${esc(s.name)}</h3><div class="grade">${esc(s.grade)}</div>
      <p>${esc(s.blurb)}</p>
      <div class="meta">
        ${live?`<span class="chip-count">${n} chapters</span><span class="go">Open \u2192</span>`
              :`<span class="chip-count">&nbsp;</span><span class="tag soon">Coming soon</span>`}
      </div></button>`;}).join("");
  root.innerHTML=`<section class="hero">
    <div class="eyebrow">Class 5 \u00b7 SOF Olympiad</div>
    <h1>Revise smart, then test yourself.</h1>
    <p>Pick a subject to read clear, chapter-wise lesson notes and take a quick quiz on what you've learned. New subjects and chapters get added here as we build them.</p>
  </section>
  <div class="subjects">${cards}</div>`;
}

function renderSubject(s){
  if(!s.chapters.length){root.innerHTML=`<div class="placeholder"><b>${esc(s.name)} is on the way</b>Notes and quizzes for this subject will appear here soon.</div>`;return;}
  const list=s.chapters.map(c=>`
    <button class="chcard" onclick="go('chapter',{subject:'${s.id}',chapter:${c.n},tab:'notes'})">
      <span class="chnum">${c.n}</span>
      <span class="chbody"><h3>${esc(c.title)}</h3>
        <span class="topics">${c.topics.map(t=>`<span class="topic">${esc(t)}</span>`).join("")}</span></span>
      <span class="charrow">\u203A</span></button>`).join("");
  root.innerHTML=`<div class="section-head"><h2>${esc(s.name)}</h2>
    <span class="count">${s.chapters.length} chapters \u00b7 notes + quiz each</span></div>
    <div class="chapters">${list}</div>`;
}

function renderChapter(s){
  const c=s.chapters.find(x=>x.n===state.chapter);
  root.innerHTML=`<div class="detail-head">
    <div class="kicker">Chapter ${c.n}</div><h2>${esc(c.title)}</h2>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="${state.tab==='notes'}" onclick="go('chapter',{tab:'notes'})">Lesson notes</button>
      <button role="tab" aria-selected="${state.tab==='quiz'}" onclick="go('chapter',{tab:'quiz'})">Quiz \u00b7 ${c.quiz.length} Q</button>
    </div></div>
    <div id="panel"></div>`;
  state.tab==="notes"?renderNotes(c):renderQuiz(c);
}

function renderNotes(c){
  const sec=s=>{
    let h=`<div class="nsec"><h3>${esc(s.h)}</h3>`;
    if(s.intro)h+=`<p class="intro">${esc(s.intro)}</p>`;
    if(s.points)h+=`<ul>${s.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`;
    if(s.defs)h+=`<dl class="deflist">${s.defs.map(d=>`<div class="def"><dt>${esc(d[0])}</dt><dd>${esc(d[1])}</dd></div>`).join("")}</dl>`;
    if(s.table)h+=tableHTML(s.table);
    if(s.bite)h+=`<div class="bite"><b>Olympiad Bite</b>${esc(s.bite)}</div>`;
    return h+`</div>`;};
  document.getElementById("panel").innerHTML=`<div class="notes">${c.notes.map(sec).join("")}</div>`;
}
function tableHTML(t){
  return `<table class="facts"><thead><tr>${t.cols.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead>
    <tbody>${t.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

function renderQuiz(c){
  const p=document.getElementById("panel");
  if(quiz.done){
    const total=c.quiz.length,sc=quiz.correct,pct=Math.round(sc/total*100);
    const msg=pct>=80?"Brilliant work!":pct>=50?"Good going \u2013 review and try again.":"Keep practising \u2013 the notes will help.";
    p.innerHTML=`<div class="quiz"><div class="result">
      <div class="big">${sc}/${total}</div><h3>${msg}</h3><p>You scored ${pct}% on ${esc(c.title)}.</p>
      <button class="btn primary" onclick="quiz={i:0,picked:null,correct:0,done:false};renderQuiz(curChapter())">Try again</button>
      <button class="btn ghost" onclick="go('chapter',{tab:'notes'})" style="margin-left:8px">Back to notes</button>
    </div></div>`;return;}
  const q=c.quiz[quiz.i],answered=quiz.picked!==null;
  const opts=q.options.map((o,i)=>{
    let cls="opt";if(answered){if(i===q.answer)cls+=" correct";else if(i===quiz.picked)cls+=" wrong";}
    return `<button class="${cls}" ${answered?"disabled":""} onclick="pick(${i})">
      <span class="key">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`;}).join("");
  p.innerHTML=`<div class="quiz">
    <div class="qbar"><div class="progress"><i style="width:${(quiz.i)/c.quiz.length*100}%"></i></div>
      <span class="score">Score <b>${quiz.correct}</b> / ${c.quiz.length}</span></div>
    <div class="qcard"><div class="qn">Question ${quiz.i+1} of ${c.quiz.length}</div>
      <div class="qtext">${esc(q.q)}</div><div class="opts">${opts}</div>
      ${answered?`<div class="explain"><b>${quiz.picked===q.answer?"Correct! ":"Answer: "+("ABCD"[q.answer])+". "}</b>${esc(q.explain)}</div>`:""}
      <div class="qnav">
        <button class="btn primary" ${answered?"":"disabled"} onclick="next()">${quiz.i+1<c.quiz.length?"Next question \u2192":"See result"}</button>
      </div></div></div>`;
}
function curChapter(){const s=DATA.subjects.find(x=>x.id===state.subject);return s.chapters.find(x=>x.n===state.chapter);}
function pick(i){if(quiz.picked!==null)return;quiz.picked=i;if(i===curChapter().quiz[quiz.i].answer)quiz.correct++;renderQuiz(curChapter());}
function next(){const c=curChapter();if(quiz.i+1<c.quiz.length){quiz.i++;quiz.picked=null;}else{quiz.done=true;}renderQuiz(c);}

document.getElementById("home").onclick=()=>go("home");
go("home");
</script>
</body>
</html>
